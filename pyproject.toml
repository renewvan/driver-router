[project]
name = "driver-router"
# Fixed placeholder: nothing reads this. The git release tag is the only version
# source (stamped into the image as DRIVER_VERSION).
version = "0.0.0"
description = "RUT-360 Data to Server MQTT -> renewvan-bus router remap driver"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=1.6,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["driver_router*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
